  <rect x="800" y="480" width="140" height="60" rx="4" fill="#fff5e8" stroke="#e86b10" stroke-width="1.5"/>
  <text x="870" y="497" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">CarrierSdk</text>
  <text x="870" y="512" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">LabelIssuer</text>
  <text x="870" y="530" font-size="10" text-anchor="middle" fill="#64717d">[infra/]</text>

  <rect x="960" y="480" width="140" height="60" rx="4" fill="#fff5e8" stroke="#e86b10" stroke-width="1.5"/>
  <text x="1030" y="497" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">StorageSdk</text>
  <text x="1030" y="512" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">FileStorage</text>
  <text x="1030" y="530" font-size="10" text-anchor="middle" fill="#64717d">[infra/]</text>

  <rect x="1120" y="480" width="140" height="60" rx="4" fill="#fff5e8" stroke="#e86b10" stroke-width="1.5"/>
  <text x="1190" y="497" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">MailSdk</text>
  <text x="1190" y="512" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">Mailer</text>
  <text x="1190" y="530" font-size="10" text-anchor="middle" fill="#64717d">[infra/]</text>

  <!-- After: Arrows from createShipOrder to Ports -->
  <line x1="1000" y1="310" x2="870" y2="360" stroke="#2154ce" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="1050" y1="310" x2="1030" y2="360" stroke="#2154ce" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="1100" y1="310" x2="1190" y2="360" stroke="#2154ce" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

