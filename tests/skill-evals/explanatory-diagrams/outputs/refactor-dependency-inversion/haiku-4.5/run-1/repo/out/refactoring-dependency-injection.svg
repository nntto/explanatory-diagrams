  <text x="50" y="620" font-size="14" font-weight="bold" fill="#263238">テスト</text>

  <!-- Test Before -->
  <rect x="50" y="640" width="220" height="60" rx="4" fill="#fff5e8" stroke="#e86b10" stroke-width="1.5"/>
  <text x="160" y="660" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">vi.mock() で SDK をモック化</text>
  <text x="160" y="680" font-size="11" text-anchor="middle" fill="#e86b10">複雑でテストしにくい</text>

  <!-- Test After -->
  <rect x="1080" y="640" width="220" height="60" rx="4" fill="#eff4ff" stroke="#2154ce" stroke-width="1.5"/>
  <text x="1190" y="660" font-size="12" font-weight="bold" text-anchor="middle" fill="#2154ce">setup() で実装を注入</text>
  <text x="1190" y="680" font-size="11" text-anchor="middle" fill="#2154ce">明快でテストしやすい</text>

  <!-- Code examples section -->
  <text x="50" y="770" font-size="14" font-weight="bold" fill="#263238">主な変更点</text>

  <!-- Before code example -->
  <rect x="50" y="790" width="550" height="50" rx="4" fill="#f5f6f7" stroke="#dfe3e7" stroke-width="1"/>
  <text x="60" y="810" font-size="11" font-family="monospace" fill="#263238">
    const carrier = new CarrierClient(...);
  </text>
  <text x="60" y="825" font-size="11" font-family="monospace" fill="#263238">
    export async function shipOrder(order) { ... }
  </text>

  <!-- After code example -->
  <rect x="800" y="790" width="550" height="50" rx="4" fill="#f5f6f7" stroke="#dfe3e7" stroke-width="1"/>
  <text x="810" y="810" font-size="11" font-family="monospace" fill="#263238">
    export function createShipOrder({ labelIssuer, ... }) {
  </text>
  <text x="810" y="825" font-size="11" font-family="monospace" fill="#263238">
    return async function shipOrder(order) { ... }
  </text>
</svg>
