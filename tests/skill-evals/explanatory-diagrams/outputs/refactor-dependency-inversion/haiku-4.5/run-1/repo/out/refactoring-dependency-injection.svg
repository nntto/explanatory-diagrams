  <text x="325" y="200" font-size="12" text-anchor="middle" fill="#e86b10">SDK に直接依存</text>

  <!-- Before: shipOrder -->
  <rect x="175" y="230" width="300" height="80" rx="8" fill="#ffffff" stroke="#64717d" stroke-width="2"/>
  <text x="325" y="255" font-size="14" font-weight="bold" text-anchor="middle" fill="#263238">shipOrder.ts</text>
  <text x="325" y="275" font-size="12" text-anchor="middle" fill="#64717d">出荷処理</text>

  <!-- Before: SDK classes -->
  <rect x="50" y="360" width="140" height="60" rx="4" fill="#ffffff" stroke="#64717d" stroke-width="1.5"/>
  <text x="120" y="382" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">CarrierClient</text>
  <text x="120" y="400" font-size="11" text-anchor="middle" fill="#64717d">[carrier-sdk]</text>

  <rect x="210" y="360" width="140" height="60" rx="4" fill="#ffffff" stroke="#64717d" stroke-width="1.5"/>
  <text x="280" y="382" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">StorageClient</text>
  <text x="280" y="400" font-size="11" text-anchor="middle" fill="#64717d">[storage-sdk]</text>

  <rect x="370" y="360" width="140" height="60" rx="4" fill="#ffffff" stroke="#64717d" stroke-width="1.5"/>
  <text x="440" y="382" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">MailClient</text>
  <text x="440" y="400" font-size="11" text-anchor="middle" fill="#64717d">[mail-sdk]</text>

