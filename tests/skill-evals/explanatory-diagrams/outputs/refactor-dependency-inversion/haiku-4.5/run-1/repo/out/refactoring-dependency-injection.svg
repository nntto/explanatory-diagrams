  <text x="870" y="382" font-size="12" font-weight="bold" text-anchor="middle" fill="#2154ce" font-style="italic">LabelIssuer</text>
  <text x="870" y="400" font-size="11" text-anchor="middle" fill="#64717d">ポート</text>

  <rect x="960" y="360" width="140" height="60" rx="4" fill="#eff4ff" stroke="#2154ce" stroke-width="1.5"/>
  <text x="1030" y="382" font-size="12" font-weight="bold" text-anchor="middle" fill="#2154ce" font-style="italic">FileStorage</text>
  <text x="1030" y="400" font-size="11" text-anchor="middle" fill="#64717d">ポート</text>

  <rect x="1120" y="360" width="140" height="60" rx="4" fill="#eff4ff" stroke="#2154ce" stroke-width="1.5"/>
  <text x="1190" y="382" font-size="12" font-weight="bold" text-anchor="middle" fill="#2154ce" font-style="italic">Mailer</text>
  <text x="1190" y="400" font-size="11" text-anchor="middle" fill="#64717d">ポート</text>

