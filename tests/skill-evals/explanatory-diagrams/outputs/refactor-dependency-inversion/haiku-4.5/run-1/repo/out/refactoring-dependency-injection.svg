<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="850" viewBox="0 0 1400 850" style="background: #ffffff;">
  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e86b10" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2154ce" />
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9aa5b1" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#263238">
    依存性逆転によるリファクタリング
  </text>

  <!-- Subtitle -->
  <text x="700" y="65" font-size="14" text-anchor="middle" fill="#64717d">
    実装クラスへの直接依存から、ポートインターフェース経由の依存に変更。テスト時のモック注入も容易に。
  </text>

  <!-- Legend -->
  <text x="50" y="100" font-size="14" font-weight="bold" fill="#263238">凡例</text>

  <!-- Legend items -->
  <rect x="50" y="110" width="160" height="35" rx="4" fill="#ffffff" stroke="#64717d" stroke-width="1.5"/>
  <text x="130" y="135" font-size="12" text-anchor="middle" fill="#263238" font-weight="bold">実装クラス</text>

  <rect x="230" y="110" width="180" height="35" rx="4" fill="#eff4ff" stroke="#2154ce" stroke-width="1.5"/>
  <text x="320" y="135" font-size="12" text-anchor="middle" fill="#2154ce" font-weight="bold">ポート</text>

  <line x1="440" y1="128" x2="500" y2="128" stroke="#e86b10" stroke-width="2.5"/>
  <text x="515" y="132" font-size="12" fill="#264238">直接依存</text>

  <line x1="650" y1="128" x2="710" y2="128" stroke="#2154ce" stroke-width="2.5"/>
  <text x="725" y="132" font-size="12" fill="#264238">インターフェース経由</text>

  <!-- LEFT SIDE: BEFORE -->
