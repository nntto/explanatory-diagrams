  <line x1="870" y1="420" x2="870" y2="480" stroke="#e86b10" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowOrange)"/>
  <line x1="1030" y1="420" x2="1030" y2="480" stroke="#e86b10" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowOrange)"/>
  <line x1="1190" y1="420" x2="1190" y2="480" stroke="#e86b10" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowOrange)"/>

  <!-- After: main.ts box -->
  <rect x="925" y="610" width="300" height="80" rx="8" fill="#ffffff" stroke="#64717d" stroke-width="2"/>
  <text x="1075" y="635" font-size="14" font-weight="bold" text-anchor="middle" fill="#263238">main.ts</text>
  <text x="1075" y="655" font-size="12" text-anchor="middle" fill="#64717d">依存性を注入</text>

  <!-- Arrow from main to createShipOrder -->
  <line x1="1075" y1="690" x2="1075" y2="310" stroke="#2154ce" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="1095" y="505" font-size="12" fill="#2154ce" font-weight="bold">DI</text>

